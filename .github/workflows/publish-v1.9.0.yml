name: Publish v1.9.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.9.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          zip -r release-assets/AI-Wedding-Photography-Pro-Universal-Core-v1.9.0.zip core \
            -x '*/__pycache__/*' '*.pyc' '*.DS_Store'

          zip -r release-assets/Ai-Wedding-Photography-Pro-Xiaoyunque-v1.9.0.zip platforms/xiaoyunque/runtime \
            -x '*/__pycache__/*' '*.pyc' '*.DS_Store'

          zip -r release-assets/Ai-Wedding-Photography-Pro-Doubao-v1.9.0.zip platforms/doubao/runtime \
            -x '*/__pycache__/*' '*.pyc' '*.DS_Store'

          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.9.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.9.0 already exists; nothing to publish."
            exit 0
          fi

          gh release create v1.9.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "AI Wedding Photography Pro v1.9.0 / Ai 婚纱摄影 Pro v1.9.0" \
            --notes-file docs/releases/v1.9.0.md \
            release-assets/AI-Wedding-Photography-Pro-Universal-Core-v1.9.0.zip \
            release-assets/Ai-Wedding-Photography-Pro-Xiaoyunque-v1.9.0.zip \
            release-assets/Ai-Wedding-Photography-Pro-Doubao-v1.9.0.zip \
            release-assets/SHA256SUMS.txt
